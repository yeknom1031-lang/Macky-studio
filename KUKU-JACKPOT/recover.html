<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff6df"><title>九九ビート — アクセスを修復</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:#fff6df;color:#18394a;font:700 16px/1.8 system-ui,sans-serif}main{max-width:530px;width:100%;padding:30px;border:2px solid #dfd5bc;border-radius:24px;background:#fffdf4;box-shadow:0 8px 0 #18394a0c}.badge{font-size:12px;letter-spacing:.15em;color:#469286}h1{font-size:27px;line-height:1.5;margin:12px 0}p{font-size:14px}button,a{font:inherit}button{width:100%;padding:16px;margin:12px 0;border:0;border-radius:15px;background:#ef795f;color:#18394a;box-shadow:0 4px 0 #ce604b;cursor:pointer}button:disabled{opacity:.55;cursor:wait}a{color:#267f78}#status{min-height:48px;color:#517465;font-size:13px}.note{font-size:12px;color:#7c877b}@media(orientation:landscape) and (max-height:450px){main{padding:18px 26px}h1{font-size:22px;margin:5px 0}p{margin:6px 0}button{padding:12px;margin:6px 0}#status{min-height:24px}}
</style></head><body><main><span class="badge">KUKU • BEAT</span><h1>ゲームを開けるように<br>修復します</h1><p>Safariでページを開けなくなる不具合を直しました。<br>この端末に保存されたゲームを更新します。</p><p><strong>九九の記録と設定は、そのまま残ります。</strong></p><button id="repair" type="button">修復して ゲームを開く</button><p id="status" role="status" aria-live="polite">通信できる状態で、上のボタンを押してください。</p><p class="note">修復後は、ふだんのURL・ホーム画面のアイコンから遊べます。</p></main><script>
const button=document.getElementById('repair'),status=document.getElementById('status');
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
button.onclick=async()=>{
 button.disabled=true;status.textContent='修正版を読み込んでいます…';
 try{
  if(!('serviceWorker' in navigator)){location.replace('/');return;}
  const manifestResponse=await fetch('/recovery-version.json',{cache:'no-store'});
  if(!manifestResponse.ok)throw new Error('通信を確認して、もう一度おためしください。');
  const manifest=await manifestResponse.json();
  const registration=await navigator.serviceWorker.register('/sw.js',{updateViaCache:'none'});
  await registration.update();
  const deadline=Date.now()+60000;
  let activated=false;
  while(Date.now()<deadline){
   if(registration.waiting){registration.waiting.postMessage({type:'ACTIVATE_UPDATE'});status.textContent='保存されたゲームを更新しています…';}
   const controller=navigator.serviceWorker.controller;
   if(controller){
    const reply=await new Promise(resolve=>{
     const listener=event=>{if(event.source===controller&&['CACHE_STATUS','CACHE_ERROR'].includes(event.data?.type)){clearTimeout(timer);navigator.serviceWorker.removeEventListener('message',listener);resolve(event.data);}};
     const timer=setTimeout(()=>{navigator.serviceWorker.removeEventListener('message',listener);resolve(null);},1800);
     navigator.serviceWorker.addEventListener('message',listener);controller.postMessage({type:'GET_CACHE_STATUS'});
    });
    if(reply?.type==='CACHE_STATUS'&&reply.version===manifest.version){activated=true;break;}
   }
   await wait(200);
  }
  if(!activated)throw new Error('更新がまだ完了していません。通信を確認して、もう一度おためしください。');
  status.textContent='修復できました。ゲームを開きます！';
  location.replace('/');
 }catch(error){status.textContent=error.message||'修復できませんでした。通信を確認して、もう一度おためしください。';button.disabled=false;button.textContent='もう一度 修復する';}
};
</script></body></html>
